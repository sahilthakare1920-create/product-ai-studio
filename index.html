<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProductSnap AI - Studio Product Photos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 text-center">
    <h1 class="text-2xl font-bold mb-2 text-indigo-400">ProductSnap AI 📸</h1>
    <p class="text-gray-400 text-sm mb-6">Turn ordinary product photos into HD Studio Ads</p>

    <!-- Upload Section -->
    <div class="mb-4 text-left">
      <label class="block text-sm font-medium mb-2 text-gray-300">1. Upload Product Photo</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
    </div>

    <!-- Prompt / Preset Section -->
    <div class="mb-6 text-left">
      <label class="block text-sm font-medium mb-2 text-gray-300">2. Choose Studio Style</label>
      <select id="promptPreset" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm mb-2">
        <option value="Luxury marble countertop with soft morning sunlight, professional product photo">Marble Table & Sunlight</option>
        <option value="Wooden desk with green leaves in background, natural lighting, high resolution">Wooden Desk & Nature</option>
        <option value="Minimalist clean studio background with soft podium shadows, 8k resolution">Minimalist Studio Podium</option>
      </select>
    </div>

    <!-- Generate Button -->
    <button id="generateBtn" onclick="generatePhoto()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg">
      Generate Studio Photo ✨
    </button>

    <!-- Output Result Section -->
    <div id="resultContainer" class="mt-6 hidden">
      <h3 class="text-sm font-medium mb-2 text-gray-300">Generated Photo:</h3>
      <img id="outputImage" src="" alt="AI Output" class="w-full rounded-lg shadow-md border border-gray-700 mb-3">
      <a id="downloadBtn" href="#" download="product_photo.png" class="block w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg text-center text-sm">
        Download HD Image ⬇️
      </a>
    </div>
  </div>

  <script>
    async function generatePhoto() {
      const btn = document.getElementById('generateBtn');
      btn.innerText = "Generating... ⏳";
      btn.disabled = true;

      setTimeout(() => {
        alert("UI Setup Complete! Step 3 mein hum isey Fal.ai API se connect karenge.");
        btn.innerText = "Generate Studio Photo ✨";
        btn.disabled = false;
      }, 1000);
    }
  </script>
</body>
</html>
